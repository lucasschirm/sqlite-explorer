# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate demo database
        run: bun scripts/make-demo-db.js

      # public/models is gitignored (~845 MB); the local-AI feature serves the
      # weights from this site, so fetch them before vite build bundles public/.
      # Cached between runs — on a cache hit model:fetch skips every file. Upload
      # side is deduped by Firebase Hosting (hash-checked, unchanged files are
      # not re-uploaded), so the weights transfer only on the first deploy.
      - name: Restore local AI model cache
        uses: actions/cache@v4
        with:
          path: public/models
          key: webllm-qwen25-1.5b-q4f16_1-v1
          restore-keys: webllm-qwen25-1.5b-q4f16_1-

      - name: Fetch local AI model
        run: bun run model:fetch

      - name: Build
        run: bun run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SQLITE_EXPLORER_EE0D4 }}
          channelId: live
          projectId: sqlite-explorer-ee0d4
